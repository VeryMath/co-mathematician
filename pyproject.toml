[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co-mathematician-workspace"
version = "0.3.0"
description = "Lightweight harness for a coding-agent-driven AI Co-Mathematician workspace."
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
co-math = "harness.co_math.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.co_math.assets" = ["*.json"]
"harness.co_math.project_template" = [
  "*.md",
  "agents/*.md",
  "agents/roles/*.md",
  ".agents/skills/co-mathematician/*.md",
  ".agents/skills/co-mathematician/assets/*",
  ".codex/*.toml",
  ".codex/agents/*.toml",
  ".claude/agents/*.md",
  ".cursor/rules/*.mdc",
]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
